name: build

# Every pull request must produce the complete site from the committed tree and
# the pinned submodule alone: unit tests, the Astro build, the smoke test that
# checks one page per manifest route, every internal link and anchor, the search
# index and the 404, then astro check.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: test, build, smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix infra ci
      - run: npm --prefix infra test
      - run: npm --prefix infra run build
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke.mjs
      - run: npm run check
